# igOS model definition — AM64x EVM (TI TMDS64EVM dev board)  (platform: am64x)
#
# The EVM is a DEVELOPMENT board, not a peripheral-reduced product variant, so
# it behaves differently from the IOLAN/IRG models in this platform tree:
#   * it carries no Perle identity EEPROM, so U-Boot sets no prod_id/model
#     (see nexus uEnv-am64x-evm.txt, which just hard-loads the DTB) — hence
#     `match` is EMPTY, so it is never selected by id; instead it is marked
#     `fallback = true`, making it the am64x CONFIG fallback for any unit with
#     no identity (its default-config + cli-remove apply on first boot). This
#     does not change pin-mapping: board.py matches pins by exact id only, so
#     an unidentified board keeps the full, unfiltered master pin layer;
#   * it ships the igos-am64x-evm pinmap (PINS={}), so vyos.hardware.board
#     returns _NoPinmapBoard — the full, unfiltered hardware layer, which is
#     exactly what a dev board wants.
#
# This file DOCUMENTS the board, declares its DTB, and (via `fallback = true`)
# supplies the default-config + cli-remove used for any am64x unit that
# resolves to no model. The hardware population keys below are still NOT
# applied at runtime (config fallback does not drive pin filtering; on the EVM
# image the igos-am64x-evm pinmap is empty anyway) and are kept for schema
# parity with the product variants.

match    =
fallback = true
platform = am64x
dtb      = ti/k3-am642-evm.dtb

serial   =
cell     = none
sim_mux  =
wifi     = false

ethernet    = 2
poe_pd      =
wifi_module =
