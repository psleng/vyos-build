build_type = "development"

architecture = "amd64"

debian_distribution = "bookworm"

debian_mirror = "http://deb.debian.org/debian"
debian_security_mirror = "http://deb.debian.org/debian-security"

debian_archive_areas = "main contrib non-free non-free-firmware"

#vyos_mirror = "https://packages.vyos.net/repositories/current"

## For PSL building -- comment out the above vyos_mirror and uncomment this.
vyos_mirror = "http://psleng.github.io"
vyos_signedby = "[signed-by=/etc/apt/trusted.gpg.d/psleng.key.chroot.gpg]"

vyos_branch = "current"
release_train = "current"

kernel_version = "6.18.38"
kernel_flavor = "vyos"
bootloaders = "syslinux,grub-efi"

# dm-verity root-squashfs integrity (fork feature). Default OFF so upstream and
# non-verity flavors are completely unaffected. Verity flavors (e.g.
# igos-am64x-*) set dm_verity = true, which arms: root-hash baking into the
# per-version initramfs (binary hook), a fail-closed veritysetup-open at boot,
# and the live-media=/dev/mapper/verity-root kernel cmdline token.
dm_verity = false

squashfs_compression_type = "lz4 -b 1M -no-fragments"

website_url = "https://vyos.io"
support_url = "https://support.vyos.io"
bugtracker_url = "https://vyos.dev"
documentation_url = "https://docs.vyos.io/en/latest"
project_news_url = "https://blog.vyos.io"
