# igOS model definition — AM64x EVM (TI TMDS64EVM dev board)  (platform: am64x-evm)
#
# The EVM is a DEVELOPMENT board built from the ti-evm kernel/U-Boot, not a
# peripheral-reduced Perle product variant. It is therefore its OWN platform
# (igos-am64x-evm, model tree data/models/am64x-evm/) rather than a member of
# the perle am64x tree: it shares only the SoC with the IOLAN/IRG boards and is
# built with a different kernel that produces a different dtb set. It behaves
# differently from the IOLAN/IRG models accordingly:
#   * it carries no Perle identity EEPROM, so U-Boot sets no prod_id/model
#     (see nexus uEnv-am64x-evm.txt, which just hard-loads the DTB) — hence
#     `match` is EMPTY, so it is never selected by id; instead it is marked
#     `fallback = true`, making it the am64x-evm CONFIG fallback for any unit
#     with no identity (its default-config + cli-remove apply on first boot).
#     This does not change pin-mapping: board.py matches pins by exact id only,
#     so an unidentified board keeps the full, unfiltered master pin layer;
#   * it ships the igos-am64x-evm pinmap (PINS={}), so vyos.hardware.board
#     returns _NoPinmapBoard — the full, unfiltered hardware layer, which is
#     exactly what a dev board wants.
#
# As the sole definition in the am64x-evm tree it DOCUMENTS the board, declares
# its DTB, and (via `fallback = true`) supplies the default-config + cli-remove
# used for the EVM (which resolves to no model by id). The hardware population
# keys below are still NOT applied at runtime (config fallback does not drive
# pin filtering; on the EVM image the igos-am64x-evm pinmap is empty anyway) and
# are kept for schema parity with the product variants.

match    =
fallback = true
platform = am64x-evm
dtb      = ti/k3-am642-evm.dtb

serial   =
cell     = none
sim_mux  =
wifi     = false

ethernet    = 2
poe_pd      =
wifi_module =
