# igOS model definition — IOLAN 2A  (platform: am64x)
#
# One directory = one model's complete definition (see
# vyos.system.model for the schema).  Sibling files, if present:
#   default-config   this model's config.boot.default
#   cli-remove       CLI nodes to prune for this model

match    = IOLAN-2A00, IOLAN-2A01
platform = am64x
