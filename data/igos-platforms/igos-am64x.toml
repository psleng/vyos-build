# igOS AM64x processor-family fragment.
#
# Loaded automatically by any build flavor that declares
#   platform = "igos-am64x"
# Merged between the `architecture` and `flavor` layers, so flavor TOMLs
# can still override anything below.
#
# Put here ONLY things shared by every AM64x board variant: kernel package,
# bootloader bits, family-wide Debian deps, etc. Per-board pin mappings go
# in data/igos-pinmaps/<flavor>/pinmap.py and are pulled in via the
# `pinmap_file` key on the flavor itself.

# Anything cellular/serial-control needs libgpiod at runtime. Hardware-only
# images carry it; cloud/VM flavors don't reference this platform.
packages = [
  "python3-libgpiod",
]

# Per-model definition tree (relative to data/models/).  The model tree is an
# ARCHITECTURE concern, so it lives here rather than per-flavor: every Perle
# AM64x image (the family "all" build and future per-variant builds) inherits
# it simply by declaring `platform = "igos-am64x"`.  Ships data/models/am64x/
# into /usr/share/igos/models/am64x/; at boot vyos.system.model resolves this
# unit's identity (prod_id/model) to a model dir.
#
# This tree holds the Perle IOLAN/IRG boards, which all resolve by EEPROM
# identity.  The AM64x EVM is NOT here -- it is its own platform (igos-am64x-evm,
# built from the ti-evm kernel that produces a different dtb set).  As a result
# this tree currently ships NO `fallback = true` definition: a Perle unit that
# matches no id gets the generic (unfiltered) default rather than a dev-board
# config.  If a catch-all is wanted for un-identified Perle units, mark exactly
# one IOLAN/IRG model -- or add a dedicated generic model -- `fallback = true`.
models_dir = "am64x"

# --- Device-tree blobs (dtb) -------------------------------------------------
# dtbs are NOT listed here. Each model declares its own dtb in
# data/models/am64x/<model>/model.conf via the `dtb =` key, e.g.
#     dtb = perle/k3-am642-IOLAN-2A00.dtb
# At build time the live-build hook `26-igos-dtb.binary` WALKS EVERY model.conf
# in the shipped model tree, collects the union of `dtb =` values, and copies
# each from the kernel package (/usr/lib/linux-image-*/) into the ISO's readable
# boot section at /boot/dtb/<value> (U-Boot loads the dtb from there),
# preserving the declared path VERBATIM. Only the dtbs your models actually name
# are carried -- not every dtb the kernel builds. At boot U-Boot reads the
# board's I2C identity, manufactures the same relative name, and loads
# /boot/dtb/<name>; so a model.conf `dtb =` value and the name U-Boot builds
# MUST match. To add or change a board's dtb, edit ONLY that model's model.conf
# -- the build picks it up automatically. A model naming a dtb the kernel did
# not build fails the build (skew caught early).
#
# Transitional override: a model may also set `dtb_src = <path>` to take the
# blob from a DIFFERENT name/path in the kernel output and stage it AS the `dtb`
# value (a full rename; source and dest are independent). Omit it and source =
# `dtb`. Use it when the kernel's dtb name doesn't yet match the name U-Boot
# loads, so you can fix it in config without a kernel rebuild.

# --- Bootloader payload (u-boot) ---------------------------------------------
# Debian package(s) carried in the squashfs so u-boot can be flashed or upgraded
# from user space after an image-based upgrade. u-boot is a SoC/HS-SE-signed SPL
# flashed to raw eMMC offsets; its deb installs tiboot3.bin/tispl.bin/u-boot.img
# under /usr/lib/u-boot/<platform>/. Value is a list of package names, or "none"
# (default) to pull nothing -- this lets the seam be wired now, before the
# signed/vendor deb exists.
#
# grub needs no payload key: it is already in the image via the arm64
# architecture layer (grub-efi-arm64) plus live-build's grub-efi stage, which
# also stages the signed shim + grub for UEFI Secure Boot onto the ESP.
uboot_payload = "none"

[architectures.arm64]
  # If/when a custom AM64x kernel package exists, list it here, e.g.:
  # packages = ["linux-image-am64x"]
