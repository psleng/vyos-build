# igOS model definition — IOLAN 1  (platform: am64x)
#
# One directory = one model's complete definition (see
# vyos.system.model for the schema).  Sibling files, if present:
#   default-config   this model's config.boot.default
#   cli-remove       CLI nodes to prune for this model
#
# match:    the SINGLE exact <prod_id>-<model> id this profile serves (verbatim),
#           or empty for a `fallback` model. One id per model.conf -- NOT a
#           comma-separated list. Board revisions/variants that share this dtb
#           are differentiated by the kernel at runtime (a revision parameter),
#           not by extra match ids here.
# fallback: `true` makes THIS model the platform's catch-all when a unit
#           matches no id (at most one fallback per platform); absent or
#           `false` = selected only by exact match. Products leave it unset.
# dtb:      target device-tree blob for this model, as a path RELATIVE to
#           /boot/dtb/ and used VERBATIM. The build hook 26-igos-dtb.binary
#           walks every model.conf and stages this file from the kernel output
#           (/usr/lib/linux-image-*/) to /boot/dtb/<value>; at boot U-Boot
#           builds the same name from the board's I2C identity and loads
#           /boot/dtb/<value>. So this value, the kernel-built dtb, and the
#           name U-Boot manufactures must all match; if the kernel did not
#           build it, the build fails.
# dtb_src:  OPTIONAL source override -- the path in the kernel output to take
#           the blob FROM (default: same as `dtb`). Source and dest are
#           independent full paths (a full rename), for when the kernel's dtb
#           name/path does not yet match the `dtb` (U-Boot) name; fixes it in
#           config with no kernel rebuild.
# dtb_alias: OPTIONAL clean bootloader-facing name (path RELATIVE to /boot/dtb/)
#           that U-Boot's env / GRUB load the dtb by. Staged as a real COPY of
#           `dtb` (not a symlink, so it needs no Rock Ridge on the ISO and
#           carries its own detached .sig for GRUB's verifier). EMPTY/absent =
#           the bootloader loads `dtb` directly. Lets each model name its own
#           clean alias here instead of a hardcoded rule in the build.
# serial/cell/sim_mux/wifi:  consumed at runtime by vyos.hardware.board.
# ethernet/poe_pd/wifi_module:  consumed by the build-time interfaces.conf /
#                               DTB generators (not by the runtime engine).

match    = IOLAN-1000
# fallback = true    # optional: make THIS model the platform's catch-all for
#                    # units that match no id (at most one fallback per
#                    # platform); absent or "false" = exact-match only.
platform = am64x
dtb      = perle/k3-am642-IOLAN-1000.dtb
# dtb_src = ti/k3-am642-igos-1000.dtb   # optional: take the blob from here and
#                                       # stage it as the dtb path above
dtb_alias = perle/IOLAN-1000.dtb        # clean name U-Boot env / GRUB load by

serial   = 1
cell     = none
sim_mux  =
wifi     = false

ethernet    = 1
poe_pd      =
wifi_module =
