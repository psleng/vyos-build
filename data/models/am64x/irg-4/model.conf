# igOS model definition — IRG 4  (platform: am64x)
#
# One directory = one model's complete definition (see
# vyos.system.model for the schema).  Sibling files, if present:
#   default-config   this model's config.boot.default
#   cli-remove       CLI nodes to prune for this model
#
# IRG 4's built-in modem manages its own SIM selection (sim_mux=modem) — the
# on-board GPIO SIM mux is not used, so the FSM delegates SIM handling to
# ModemManager.
#
# TODO: confirm IRG 4's real EEPROM model code(s) — placeholder below.

match    = IRG-4000
# fallback = true    # optional: make THIS model the platform's catch-all for
#                    # units that match no id (at most one fallback per
#                    # platform); absent or "false" = exact-match only.
platform = am64x
dtb      = perle/k3-am642-IRG-4000.dtb

serial   = 1
cell     = builtin
sim_mux  = modem
wifi     = false

ethernet    = 1
poe_pd      =
wifi_module =
