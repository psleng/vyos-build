set default=0
set timeout=10

insmod gzio
insmod part_msdos
insmod ext2
insmod efi_gop
insmod png

loadfont /boot/grub/dejavu-bold-16.pf2
loadfont /boot/grub/dejavu-bold-14.pf2
loadfont /boot/grub/unicode.pf2

set gfxmode="640x480x16"
set gfxpayload="640x480x16"
terminal_output gfxterm

set splash_img="/isolinux/splash.png"
if [ -e ${splash_img} ]; then
    background_image ${splash_img}
fi

# x86-only console setup (com0 serial via --unit, legacy efi_uga) stays in this
# branch so it never loads on non-x86 EFI (arm64), where it only errors.
if [ "${grub_cpu}" = "i386" ] || [ "${grub_cpu}" = "x86_64" ]; then
    insmod serial
    insmod efi_uga
    serial --unit=0 --speed=115200
    terminal_output --append serial
    terminal_input serial console
else
    terminal_input console
    terminal_output --append console
fi

set color_normal=light-gray/black
set color_highlight=white/black

# Live boot
LINUX_LIVE

# Installer (if any)
LINUX_INSTALL
