# igOS model definition — J7200 EVM (TI J7200 dev board)  (platform: j7200)
#
# Base definition for the J7200 processor family. Like the AM64x EVM, this is a
# DEVELOPMENT board:
#   * no Perle identity EEPROM, so U-Boot sets no prod_id/model (see nexus
#     uEnv-j72x-evm.txt, which just hard-loads the DTB) — `match` is EMPTY and
#     it is never selected by id; instead it is marked `fallback = true`,
#     making it the j7200 CONFIG fallback for any unit with no identity (its
#     default-config + cli-remove apply on first boot). This does not change
#     pin-mapping: board.py matches pins by exact id only;
#   * it ships the igos-j7200-evm pinmap (PINS={}), so vyos.hardware.board
#     returns _NoPinmapBoard — the full, unfiltered hardware layer.
#
# This is the seed of the j7200 platform tree: future J7200 product variants
# get their own <name>/model.conf beside this one, each filtering the J7200
# family master pinmap the same way the am64x IOLAN/IRG models do.
#
# The hardware population keys below are still NOT applied at runtime (the
# config fallback does not drive pin filtering; the j7200 EVM pinmap is empty)
# and are kept only for schema parity. The default-config / cli-remove siblings
# ARE applied as the j7200 config fallback via `fallback = true`.

match    =
fallback = true
platform = j7200
dtb      = ti/k3-j7200-evm.dtb

serial   =
cell     = none
sim_mux  =
wifi     = false

ethernet    =
poe_pd      =
wifi_module =
