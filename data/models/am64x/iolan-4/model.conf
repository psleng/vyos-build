# igOS model definition — IOLAN 4  (platform: am64x)
#
# One directory = one model's complete definition (see
# vyos.system.model for the schema).  Sibling files, if present:
#   default-config   this model's config.boot.default
#   cli-remove       CLI nodes to prune for this model
#
# Covers the 4A..4H connector sub-variants, which share this population.

match    = IOLAN-4A00, IOLAN-4A01, IOLAN-4B00, IOLAN-4B01, IOLAN-4C00, IOLAN-4C01, IOLAN-4D00, IOLAN-4D01, IOLAN-4E00, IOLAN-4E01, IOLAN-4F00, IOLAN-4F01, IOLAN-4G00, IOLAN-4G01, IOLAN-4H00, IOLAN-4H01
# fallback = true    # optional: make THIS model the platform's catch-all for
#                    # units that match no id (at most one fallback per
#                    # platform); absent or "false" = exact-match only.
platform = am64x
dtb      = ti/k3-am642-iolan-4.dtb

serial   = 4
cell     = none
sim_mux  =
wifi     = false

ethernet    = 1
poe_pd      =
wifi_module =
