# igOS J7200 processor-family fragment.
#
# Loaded automatically by any build flavor that declares
#   platform = "igos-j7200"
# Merged between the `architecture` and `flavor` layers, so flavor TOMLs
# can still override anything below.
#
# Put here ONLY things shared by every J7200 board variant: kernel package,
# bootloader bits, family-wide Debian deps, etc. Per-board pin mappings go
# in data/igos-pinmaps/<flavor>/pinmap.py and are pulled in via the
# `pinmap_file` key on the flavor itself.

# Cellular/serial-control needs libgpiod at runtime.
packages = [
  "python3-libgpiod",
]

# Per-model definition tree (relative to data/models/).  Architecture concern
# (see igos-am64x.toml): every J7200 flavor inherits it via
# `platform = "igos-j7200"`.  Ships data/models/j7200/ into
# /usr/share/igos/models/j7200/; at boot vyos.system.model resolves identity
# to a model dir, falling back to the `fallback = true` definition (the J7200
# EVM has no identity EEPROM).
models_dir = "j7200"

# --- Device-tree blobs (dtb) -------------------------------------------------
# dtbs are NOT listed here. Each model declares its own dtb in
# data/models/j7200/<model>/model.conf via the `dtb =` key, e.g.
#     dtb = ti/k3-j7200-evm.dtb
# At build time the live-build hook `26-igos-dtb.binary` WALKS EVERY model.conf
# in the shipped model tree, collects the union of `dtb =` values, and copies
# each from the kernel package (/usr/lib/linux-image-*/) into the ISO's readable
# boot section at /boot/dtb/<value> (U-Boot loads the dtb from there),
# preserving the declared path VERBATIM. Only the dtbs your models actually name
# are carried -- not every dtb the kernel builds. At boot U-Boot reads the
# board's I2C identity, manufactures the same relative name, and loads
# /boot/dtb/<name>; so a model.conf `dtb =` value and the name U-Boot builds
# MUST match. To add or change a board's dtb, edit ONLY that model's model.conf
# -- the build picks it up automatically. A model naming a dtb the kernel did
# not build fails the build (skew caught early).
#
# Transitional override: a model may also set `dtb_src = <path>` to take the
# blob from a DIFFERENT name/path in the kernel output and stage it AS the `dtb`
# value (a full rename; source and dest are independent). Omit it and source =
# `dtb`. Use it when the kernel's dtb name doesn't yet match the name U-Boot
# loads, so you can fix it in config without a kernel rebuild.

# --- Bootloader payloads (u-boot / grub) -------------------------------------
# Debian package(s) carried in the squashfs so the bootloader can be flashed or
# upgraded from user space after an image-based upgrade. Two keys because u-boot
# and grub sit on DIFFERENT secure-boot trust chains:
#   * u-boot -> SoC/HS-SE-signed SPL, flashed to raw eMMC offsets; its deb
#     installs its boot blobs under /usr/lib/u-boot/<platform>/
#   * grub   -> UEFI shim/MOK on the EFI System Partition
# Value is a list of package names, or "none" (default) to pull nothing -- this
# lets the seam be wired now, before the signed/vendor debs exist.
# Normal grub boot is ALREADY handled by the stock `grub-efi-arm64` package plus
# `grub-install --uefi-secure-boot`; set `grub_payload` only for a custom/SIGNED
# grub, e.g.  grub_payload = ["shim-signed", "grub-efi-arm64-signed"].
uboot_payload = "none"
grub_payload  = "none"

[architectures.arm64]
  # If/when a custom J7200 kernel package exists, list it here, e.g.:
  # packages = ["linux-image-j7200"]
