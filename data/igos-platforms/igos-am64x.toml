# igOS AM64x processor-family fragment.
#
# Loaded automatically by any build flavor that declares
#   platform = "igos-am64x"
# Merged between the `architecture` and `flavor` layers, so flavor TOMLs
# can still override anything below.
#
# Put here ONLY things shared by every AM64x board variant: kernel package,
# bootloader bits, family-wide Debian deps, etc. Per-board pin mappings go
# in data/igos-pinmaps/<flavor>/pinmap.py and are pulled in via the
# `pinmap_file` key on the flavor itself.

# Anything cellular/serial-control needs libgpiod at runtime. Hardware-only
# images carry it; cloud/VM flavors don't reference this platform.
packages = [
  "python3-libgpiod",
]

# Per-model definition tree (relative to data/models/).  The model tree is an
# ARCHITECTURE concern, so it lives here rather than per-flavor: every AM64x
# image (dedicated EVM build, family "all" build, future variants) inherits
# it simply by declaring `platform = "igos-am64x"`.  Ships data/models/am64x/
# into /usr/share/igos/models/am64x/; at boot vyos.system.model resolves this
# unit's identity (prod_id/model) to a model dir, falling back to the
# `fallback = true` definition when a unit has no identity (e.g. the EVM).
models_dir = "am64x"

[architectures.arm64]
  # If/when a custom AM64x kernel package exists, list it here, e.g.:
  # packages = ["linux-image-am64x"]
