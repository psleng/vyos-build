# igOS AM64x-EVM platform fragment (TI TMDS64EVM development board).
#
# Loaded automatically by any build flavor that declares
#   platform = "igos-am64x-evm"
# Merged between the `architecture` and `flavor` layers, so flavor TOMLs
# can still override anything below.
#
# WHY this is a SEPARATE platform from igos-am64x
#   The EVM shares only the SoC with the Perle IOLAN/IRG boards. It is built
#   from a DIFFERENT kernel (linux-kernel platform `ti-evm`, buildtype
#   `bookworm-am64xx-evm`) which produces a DIFFERENT dtb set (ti/k3-am642-evm)
#   than the perle kernel (`perle-igos`, which builds perle/*.dtb). Keying the
#   image platform to the kernel/BSP variant (not the SoC family) keeps each
#   platform's model tree a subset of the dtbs its kernel actually builds, so
#   the dtb-staging hook can validate strictly. The Perle boards live in
#   igos-am64x; this fragment is the EVM's own platform, mirroring how the
#   J7200 EVM has its own igos-j7200 platform.

# Serial-control / GPIO helpers at runtime, for parity with the family images.
packages = [
  "python3-libgpiod",
]

# Per-model definition tree (relative to data/models/).  Ships
# data/models/am64x-evm/ into /usr/share/igos/models/am64x-evm/.  This tree
# holds a single definition (the EVM); it has no identity EEPROM, so at boot
# vyos.system.model matches no id and uses the `fallback = true` evm definition
# for its default-config + cli-remove.
models_dir = "am64x-evm"

# --- Device-tree blobs (dtb) -------------------------------------------------
# dtbs are NOT listed here. Each model declares its own dtb in
# data/models/am64x-evm/<model>/model.conf via the `dtb =` key, e.g.
#     dtb = ti/k3-am642-evm.dtb
# At build time the live-build hook `26-igos-dtb.binary` WALKS EVERY model.conf
# in the shipped model tree, collects the union of `dtb =` values, and copies
# each from the kernel package (/usr/lib/linux-image-*/) into the ISO's readable
# boot section at /boot/dtb/<value> (U-Boot loads the dtb from there),
# preserving the declared path VERBATIM. Only the dtbs your models actually name
# are carried -- not every dtb the kernel builds. At boot U-Boot loads
# /boot/dtb/<name>; so a model.conf `dtb =` value and the name U-Boot loads MUST
# match. Because this platform's model tree ships only dtbs the ti-evm kernel
# builds, a model naming a dtb the kernel did not build fails the build (skew
# caught early).
#
# Transitional override: a model may also set `dtb_src = <path>` to take the
# blob from a DIFFERENT name/path in the kernel output and stage it AS the `dtb`
# value (a full rename; source and dest are independent). Omit it and source =
# `dtb`.

# --- Bootloader payloads (u-boot / grub) -------------------------------------
# Debian package(s) carried in the squashfs so the bootloader can be flashed or
# upgraded from user space after an image-based upgrade. Two keys because u-boot
# and grub sit on DIFFERENT secure-boot trust chains:
#   * u-boot -> SoC/HS-SE-signed SPL, flashed to raw eMMC offsets; its deb
#     installs tiboot3.bin/tispl.bin/u-boot.img under /usr/lib/u-boot/<platform>/
#   * grub   -> UEFI shim/MOK on the EFI System Partition
# Value is a list of package names, or "none" (default) to pull nothing -- this
# lets the seam be wired now, before the signed/vendor debs exist.
# Normal grub boot is ALREADY handled by the stock `grub-efi-arm64` package plus
# `grub-install --uefi-secure-boot`; set `grub_payload` only for a custom/SIGNED
# grub, e.g.  grub_payload = ["shim-signed", "grub-efi-arm64-signed"].
uboot_payload = "none"
grub_payload  = "none"

[architectures.arm64]
  # If/when a custom AM64x-EVM (ti-evm) kernel package exists, list it here, e.g.:
  # packages = ["linux-image-am64x-evm"]
