# igOS AM64x EVM hardware image — TI AM64x EVM (TMDS64EVM) dev board.
#
# See igos-am64x-all.toml for the layering model. The EVM is its own image: it is
# built from the ti-evm kernel and ships only the EVM dtb (models_dir = am64x-evm),
# so it does not share the perle am64x model tree — it shares only the SoC.

image_format = "iso"

# Enable dm-verity integrity protection of the root squashfs (see
# igos-am64x-all.toml / data/defaults.toml). Arms root-hash baking into the
# initramfs + fail-closed verify at boot.
dm_verity = true

pinmap_file = "igos-am64x-evm/pinmap.py"

# Runtime deps (parity with the family images; libgpiod for serial-control/GPIO).
packages = [
  "python3-libgpiod",
  # veritysetup (dm-verity setup tool). Pulled into the image so the initramfs
  # verity-open hook can unlock the root squashfs; required by dm_verity = true.
  "cryptsetup-bin",
]

# Per-model definition tree (relative to data/models/). Ships data/models/am64x-evm/
# into /usr/share/igos/models/am64x-evm/ (a single EVM definition). The EVM has no
# identity EEPROM, so at boot vyos.system.model matches no id and uses the
# `fallback = true` am64x-evm/evm definition for its default-config + cli-remove.
# Its own (empty) pin map keeps vyos.hardware.board inert regardless. Each
# model.conf declares its own `dtb =`, staged by the 26-igos-dtb.binary hook.
models_dir = "am64x-evm"

# Bootloader payload (see igos-am64x-all.toml). "none" pulls nothing.
uboot_payload = "none"

# Squashfs compression — favor BOOT SPEED over image size on this slow ARM SoC.
# lz4 decompresses far faster than the arm64 default (xz), at the cost of a
# larger image. Set at the flavor level so it overrides architectures/arm64.toml
# (layer order defaults < architecture < flavor) without touching the upstream
# arm64 default.
squashfs_compression_type = "lz4 -b 1M -no-fragments"

[architectures.arm64]
