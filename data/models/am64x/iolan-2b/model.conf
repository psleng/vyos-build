# igOS model definition — IOLAN 2B  (platform: am64x)
#
# One directory = one model's complete definition (see
# vyos.system.model for the schema).  Sibling files, if present:
#   default-config   this model's config.boot.default
#   cli-remove       CLI nodes to prune for this model

match    = IOLAN-2B00, IOLAN-2B01
# fallback = true    # optional: make THIS model the platform's catch-all for
#                    # units that match no id (at most one fallback per
#                    # platform); absent or "false" = exact-match only.
platform = am64x
dtb      = perle/k3-am642-IOLAN-2B00.dtb

serial   = 4
cell     = socket
sim_mux  = modem
wifi     = false

ethernet    = 2
poe_pd      =
wifi_module =
